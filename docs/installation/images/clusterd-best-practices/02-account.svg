<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 700" width="840" height="700" role="img" aria-labelledby="02-account-title 02-account-desc">
  <title id="02-account-title">Create an Account and Open the Wizard</title>
  <desc id="02-account-desc">Create an Account and Open the Wizard</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="0" />
  <text x="420" y="52" font-size="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#0f172a" text-anchor="middle">Create an Account and Open the Wizard</text>
  <g id="notice-badge">
    <rect x="160" y="70" width="520" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="420" y="91" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="500" fill="#475569" text-anchor="middle">Workflow diagram, not a live screenshot</text>
  </g>
  <g id="stage-1">
    <rect x="40" y="120" width="760" height="118" rx="8" fill="#f8faff" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="134" width="78" height="26" rx="4" fill="#2563eb" />
    <text x="95" y="152" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">STEP 1</text>
    <text x="146" y="153" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d4ed8">Open the installation web page</text>
    <text x="60" y="188" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">Open port 18093 on the ClusterD host</text>
    <text x="60" y="214" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">If an account exists, log in without reinitializing</text>
  </g>
  <path d="M 420 238 L 420 266" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g id="stage-2">
    <rect x="40" y="266" width="760" height="118" rx="8" fill="#f8faff" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="280" width="78" height="26" rx="4" fill="#2563eb" />
    <text x="95" y="298" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">STEP 2</text>
    <text x="146" y="299" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d4ed8">Create a ClusterD account</text>
    <text x="60" y="334" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">Enter a username and a separate strong password</text>
    <text x="60" y="360" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">Create the account; keep credentials out of tickets</text>
  </g>
  <path d="M 420 384 L 420 412" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g id="stage-3">
    <rect x="40" y="412" width="760" height="118" rx="8" fill="#f8faff" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="426" width="78" height="26" rx="4" fill="#2563eb" />
    <text x="95" y="444" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">STEP 3</text>
    <text x="146" y="445" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d4ed8">Log in and open the deployment wizard</text>
    <text x="60" y="480" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">Open AGIOne Deployment → Deployment Wizard</text>
    <text x="60" y="506" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">Continue when the topology selection page appears</text>
  </g>
  <path d="M 420 530 L 420 558" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g id="criteria-banner">
    <rect x="40" y="558" width="760" height="118" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
    <rect x="56" y="572" width="78" height="26" rx="4" fill="#d97706" />
    <text x="95" y="590" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">NOTE</text>
    <text x="144" y="591" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#b45309">Separate accounts</text>
    <text x="60" y="623" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#1e293b">The ClusterD account is not the target SSH account</text>
    <text x="60" y="649" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#1e293b">It is not the AGIOne account obtained after installation</text>
  </g>
</svg>
