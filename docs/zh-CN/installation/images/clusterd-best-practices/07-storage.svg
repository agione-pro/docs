<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 846" width="840" height="846" role="img" aria-labelledby="07-storage-title 07-storage-desc">
  <title id="07-storage-title">SSH 探测与存储选择</title>
  <desc id="07-storage-desc">SSH 探测与存储选择</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="0" />
  <text x="420" y="52" font-size="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#0f172a" text-anchor="middle">SSH 探测与存储选择</text>
  <g id="notice-badge">
    <rect x="160" y="70" width="520" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="420" y="91" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="500" fill="#475569" text-anchor="middle">流程示意图，非实机截图</text>
  </g>
  <g id="stage-1">
    <rect x="40" y="120" width="760" height="118" rx="8" fill="#f8faff" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="134" width="78" height="26" rx="4" fill="#2563eb" />
    <text x="95" y="152" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">步骤 1</text>
    <text x="146" y="153" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d4ed8">填写目标节点 SSH 信息</text>
    <text x="60" y="188" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">使用实际节点地址、端口和现场认证资料</text>
    <text x="60" y="214" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">私钥路径指向 ClusterD 控制端上的文件</text>
  </g>
  <path d="M 420 238 L 420 266" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g id="stage-2">
    <rect x="40" y="266" width="760" height="118" rx="8" fill="#f8faff" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="280" width="78" height="26" rx="4" fill="#2563eb" />
    <text x="95" y="298" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">步骤 2</text>
    <text x="146" y="299" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d4ed8">测试连接与磁盘：只读探测</text>
    <text x="60" y="334" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">等待 CPU、内存、磁盘与适用状态回显</text>
    <text x="60" y="360" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">探测不格式化磁盘；修改信息后重新探测</text>
  </g>
  <path d="M 420 384 L 420 412" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g id="stage-3">
    <rect x="40" y="412" width="760" height="118" rx="8" fill="#f8faff" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="426" width="78" height="26" rx="4" fill="#2563eb" />
    <text x="95" y="444" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">步骤 3</text>
    <text x="146" y="445" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d4ed8">两种存储方式，仅选一种</text>
    <text x="60" y="480" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">独立空盘：核对整盘设备，再授权安装时初始化</text>
    <text x="60" y="506" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">已有 /data：选择复用及专用 /data/agione 目录</text>
  </g>
  <path d="M 420 530 L 420 558" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g id="stage-4">
    <rect x="40" y="558" width="760" height="118" rx="8" fill="#f8faff" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="572" width="78" height="26" rx="4" fill="#2563eb" />
    <text x="95" y="590" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">步骤 4</text>
    <text x="146" y="591" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d4ed8">安装后核对实际挂载</text>
    <text x="60" y="626" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">统一入口：/var/lib/agione/local-path</text>
    <text x="60" y="652" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">运行根：/var/lib/agione/local-path/runtime</text>
  </g>
  <path d="M 420 676 L 420 704" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g id="criteria-banner">
    <rect x="40" y="704" width="760" height="118" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
    <rect x="56" y="718" width="78" height="26" rx="4" fill="#dc2626" />
    <text x="95" y="736" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">注意</text>
    <text x="144" y="737" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#b91c1c">数据风险</text>
    <text x="60" y="769" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#1e293b">不要将已有分区、文件系统或数据的盘当作空盘</text>
    <text x="60" y="795" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#1e293b">设备名须按实际探测选择，不直接照抄 /dev/vdb</text>
  </g>
</svg>
