<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 846" width="840" height="846" role="img" aria-labelledby="06-logging-title 06-logging-desc">
  <title id="06-logging-title">日志策略与实际存储位置</title>
  <desc id="06-logging-desc">日志策略与实际存储位置</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="0" />
  <text x="420" y="52" font-size="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#0f172a" text-anchor="middle">日志策略与实际存储位置</text>
  <g id="notice-badge">
    <rect x="160" y="70" width="520" height="32" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="420" y="91" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="500" fill="#475569" text-anchor="middle">流程示意图，非实机截图</text>
  </g>
  <g id="stage-1">
    <rect x="40" y="120" width="760" height="118" rx="8" fill="#f8faff" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="134" width="78" height="26" rx="4" fill="#2563eb" />
    <text x="95" y="152" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">步骤 1</text>
    <text x="146" y="153" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d4ed8">选择是否启用结构化日志</text>
    <text x="60" y="188" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">关闭时不配置这套应用日志持久化</text>
    <text x="60" y="214" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">ClusterD 任务日志属于不同概念</text>
  </g>
  <path d="M 420 238 L 420 266" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g id="stage-2">
    <rect x="40" y="266" width="760" height="118" rx="8" fill="#f8faff" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="280" width="78" height="26" rx="4" fill="#2563eb" />
    <text x="95" y="298" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">步骤 2</text>
    <text x="146" y="299" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d4ed8">启用时选择本地、NAS 或自动</text>
    <text x="60" y="334" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">自动：NAS 配置完整则用 NAS，否则用本地</text>
    <text x="60" y="360" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">NAS 挂载失败不静默降级为本地</text>
  </g>
  <path d="M 420 384 L 420 412" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g id="stage-3">
    <rect x="40" y="412" width="760" height="118" rx="8" fill="#f8faff" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="426" width="78" height="26" rx="4" fill="#2563eb" />
    <text x="95" y="444" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">步骤 3</text>
    <text x="146" y="445" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d4ed8">设置轮转，并选择归档节点</text>
    <text x="60" y="480" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">示例：保留 7 天，64Mi / 文件，最多 32 个</text>
    <text x="60" y="506" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">归档节点在添加节点步骤选择，留空用首个核心节点</text>
  </g>
  <path d="M 420 530 L 420 558" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g id="stage-4">
    <rect x="40" y="558" width="760" height="118" rx="8" fill="#f8faff" stroke="#2563eb" stroke-width="1.5" />
    <rect x="56" y="572" width="78" height="26" rx="4" fill="#2563eb" />
    <text x="95" y="590" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">步骤 4</text>
    <text x="146" y="591" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#1d4ed8">安装后检查挂载与日志写入</text>
    <text x="60" y="626" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">按实际配置路径执行 findmnt -T</text>
    <text x="60" y="652" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#334155">选择应用盘不表示所有日志都在该盘</text>
  </g>
  <path d="M 420 676 L 420 704" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" fill="none" />
  <g id="criteria-banner">
    <rect x="40" y="704" width="760" height="118" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" />
    <rect x="56" y="718" width="78" height="26" rx="4" fill="#d97706" />
    <text x="95" y="736" font-size="18" font-family="system-ui, -apple-system, sans-serif" font-weight="600" fill="#ffffff" text-anchor="middle">注意</text>
    <text x="144" y="737" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" fill="#b45309">存储边界</text>
    <text x="60" y="769" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#1e293b">NAS 需事先可用并可写；本地日志不提供跨节点高可用</text>
    <text x="60" y="795" font-size="18" font-family="system-ui, -apple-system, sans-serif" fill="#1e293b">轮转上限可能提前清理，保留天数不是完整时长保证</text>
  </g>
</svg>
