<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-magenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#be185d"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; letter-spacing: 0; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #526078; }
      .zone-title { font-size: 20px; font-weight: 700; }
      .box-title { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; }
      .small { font-size: 12px; fill: #475569; }
      .client { fill: #f5f9ff; stroke: #3b82f6; }
      .control { fill: #edf9f1; stroke: #22a65a; }
      .compute { fill: #fff7ed; stroke: #f97316; }
      .external { fill: #fff1f7; stroke: #db2777; }
      .node { fill: #ffffff; stroke-width: 1.5; rx: 8; }
      .line { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow-gray); }
      .dash { fill: none; stroke: #ea580c; stroke-width: 1.5; stroke-dasharray: 7 6; marker-end: url(#arrow-orange); }
      .magenta-line { fill: none; stroke: #be185d; stroke-width: 1.5; stroke-dasharray: 7 6; marker-end: url(#arrow-magenta); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#ffffff"/>
  <text x="40" y="48" class="title">AGIOne Network Architecture</text>
  <text x="40" y="75" class="subtitle">Reference topology for enterprise access, control-plane services, and heterogeneous GPU / NPU compute pools.</text>

  <rect x="40" y="105" width="575" height="180" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="64" cy="133" r="12" fill="#ffffff" stroke="#64748b"/>
  <text x="60" y="138" class="label">1</text>
  <text x="86" y="140" class="zone-title">Client Zone (Enterprise Intranet)</text>

  <rect x="65" y="170" width="155" height="70" class="client node"/>
  <text x="142" y="197" text-anchor="middle" class="box-title">Internal ChatBox</text>
  <text x="142" y="220" text-anchor="middle" class="small">Agent platform</text>
  <rect x="245" y="170" width="190" height="70" class="client node"/>
  <text x="340" y="197" text-anchor="middle" class="box-title">Business Systems</text>
  <text x="340" y="220" text-anchor="middle" class="small">MES / ERP / Knowledge Base</text>
  <rect x="460" y="170" width="130" height="70" class="client node"/>
  <text x="525" y="197" text-anchor="middle" class="box-title">Dev / Ops</text>
  <text x="525" y="220" text-anchor="middle" class="small">SDK / API</text>

  <rect x="40" y="325" width="760" height="750" rx="14" class="control" stroke-width="1.8"/>
  <circle cx="67" cy="357" r="12" fill="#ffffff" stroke="#168647"/>
  <text x="63" y="362" class="label">2</text>
  <text x="90" y="364" class="zone-title" style="fill:#12643a">AGIOne Control Plane (Enterprise Intranet, &gt;= 3 nodes)</text>

  <rect x="190" y="400" width="190" height="74" class="node" stroke="#16a34a"/>
  <text x="285" y="430" text-anchor="middle" class="box-title">Load Balancer</text>
  <text x="285" y="453" text-anchor="middle" class="small">443 / TCP</text>
  <rect x="455" y="400" width="210" height="74" class="node" stroke="#f97316"/>
  <text x="560" y="430" text-anchor="middle" class="box-title">On-Prem Image Registry</text>
  <text x="560" y="453" text-anchor="middle" class="small">Optional · 8090 / TCP</text>

  <rect x="150" y="510" width="360" height="410" rx="14" fill="#dff5e5" stroke="#22a65a" stroke-width="1.5"/>
  <text x="330" y="541" text-anchor="middle" class="box-title" style="fill:#12643a">Management Nodes</text>
  <text x="330" y="563" text-anchor="middle" class="small">At least 3 · no GPU required</text>

  <rect x="185" y="590" width="290" height="90" class="node" stroke="#16a34a"/>
  <text x="330" y="616" text-anchor="middle" class="box-title">Mgmt-1</text>
  <text x="330" y="639" text-anchor="middle" class="label">CPU / RAM sized by workload</text>
  <text x="330" y="660" text-anchor="middle" class="small">100G + 400G · Core / DB / middleware</text>
  <rect x="185" y="705" width="290" height="90" class="node" stroke="#16a34a"/>
  <text x="330" y="731" text-anchor="middle" class="box-title">Mgmt-2</text>
  <text x="330" y="754" text-anchor="middle" class="label">CPU / RAM sized by workload</text>
  <text x="330" y="775" text-anchor="middle" class="small">100G + 400G · Core / DB / middleware</text>
  <rect x="185" y="820" width="290" height="90" class="node" stroke="#16a34a"/>
  <text x="330" y="846" text-anchor="middle" class="box-title">Mgmt-3</text>
  <text x="330" y="869" text-anchor="middle" class="label">CPU / RAM sized by workload</text>
  <text x="330" y="890" text-anchor="middle" class="small">100G + 400G · Core / DB / middleware</text>
  <path d="M330 680 L330 705" class="line"/>
  <path d="M330 795 L330 820" class="line"/>
  <text x="348" y="697" class="small">K8s cluster network / heartbeat</text>

  <path d="M285 474 L130 474 L130 635 L185 635" class="line"/>
  <path d="M285 474 L120 474 L120 750 L185 750" class="line"/>
  <path d="M285 474 L110 474 L110 865 L185 865" class="line"/>
  <path d="M220 240 L220 400" class="line"/>
  <path d="M340 240 L340 400" class="line"/>
  <path d="M525 240 L525 400" class="line"/>
  <text x="101" y="310" class="small">Enterprise HTTPS 443</text>
  <text x="304" y="310" class="small">Enterprise HTTPS 443</text>
  <text x="498" y="310" class="small">Enterprise HTTPS 443</text>

  <rect x="90" y="965" width="235" height="78" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="207" y="997" text-anchor="middle" class="box-title" style="fill:#9a3412">Managed Shared Storage</text>
  <text x="207" y="1021" text-anchor="middle" class="small">&gt;= 1024 GB · block storage</text>
  <path d="M250 910 L230 965" class="line"/>
  <path d="M330 910 L280 965" class="line"/>

  <rect x="820" y="365" width="740" height="710" rx="14" class="compute" stroke-width="1.8"/>
  <circle cx="847" cy="397" r="12" fill="#ffffff" stroke="#ea580c"/>
  <text x="843" y="402" class="label">3</text>
  <text x="870" y="404" class="zone-title" style="fill:#c2410c">Managed Compute Pools (heterogeneous GPU / NPU workers)</text>
  <text x="870" y="430" class="small">At least one accelerator card per worker node</text>

  <rect x="850" y="470" width="220" height="550" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="960" y="500" text-anchor="middle" class="box-title" style="fill:#9a3412;font-size:15px">Pool A · NVIDIA Hopper</text>
  <text x="960" y="522" text-anchor="middle" class="small">H200 / H20 / H100 / H800</text>
  <rect x="880" y="560" width="160" height="125" class="node" stroke="#f97316"/>
  <text x="960" y="586" text-anchor="middle" class="box-title">Worker A1</text>
  <text x="960" y="610" text-anchor="middle" class="small">8C / 16G reserved</text>
  <text x="960" y="631" text-anchor="middle" class="small">200G + system disk</text>
  <text x="960" y="652" text-anchor="middle" class="label">GPU + RDMA</text>
  <rect x="880" y="730" width="160" height="72" class="node" stroke="#f97316"/>
  <text x="960" y="758" text-anchor="middle" class="box-title">Worker A2</text>
  <text x="960" y="781" text-anchor="middle" class="small">Same as A1</text>
  <path d="M960 685 L960 730" class="dash"/>
  <text x="975" y="714" class="small">RDMA · RoCE 100G+</text>
  <path d="M960 802 L960 880" class="line"/>
  <rect x="885" y="880" width="150" height="90" rx="8" fill="#fffaf0" stroke="#f97316"/>
  <text x="960" y="910" text-anchor="middle" class="box-title">Data Disk / NAS</text>
  <text x="960" y="933" text-anchor="middle" class="small">Model weights</text>
  <text x="960" y="954" text-anchor="middle" class="small">&gt;= 2 TB</text>

  <rect x="1090" y="470" width="220" height="550" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="1200" y="500" text-anchor="middle" class="box-title" style="fill:#9a3412;font-size:14px">Pool B · NVIDIA Ada / Ampere</text>
  <text x="1200" y="522" text-anchor="middle" class="small">L20 / L40 / A10 / A100</text>
  <rect x="1120" y="560" width="160" height="125" class="node" stroke="#f97316"/>
  <text x="1200" y="586" text-anchor="middle" class="box-title">Worker B1</text>
  <text x="1200" y="610" text-anchor="middle" class="small">8C / 16G reserved</text>
  <text x="1200" y="631" text-anchor="middle" class="small">200G + system disk</text>
  <text x="1200" y="652" text-anchor="middle" class="label">GPU</text>
  <rect x="1120" y="730" width="160" height="72" class="node" stroke="#f97316"/>
  <text x="1200" y="758" text-anchor="middle" class="box-title">Worker B2</text>
  <text x="1200" y="781" text-anchor="middle" class="small">Same as B1</text>
  <path d="M1200 685 L1200 730" class="dash"/>

  <rect x="1330" y="470" width="200" height="550" rx="12" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
  <text x="1430" y="500" text-anchor="middle" class="box-title" style="fill:#9a3412;font-size:14px">Pool C · Domestic NPU</text>
  <text x="1430" y="522" text-anchor="middle" class="small">Ascend / Hygon / Cambricon</text>
  <rect x="1350" y="560" width="160" height="125" class="node" stroke="#f97316"/>
  <text x="1430" y="586" text-anchor="middle" class="box-title">Worker C1</text>
  <text x="1430" y="610" text-anchor="middle" class="small">8C / 16G reserved</text>
  <text x="1430" y="631" text-anchor="middle" class="small">200G + system disk</text>
  <text x="1430" y="652" text-anchor="middle" class="label">NPU + RDMA</text>
  <rect x="1350" y="730" width="160" height="72" class="node" stroke="#f97316"/>
  <text x="1430" y="758" text-anchor="middle" class="box-title">Worker C2</text>
  <text x="1430" y="781" text-anchor="middle" class="small">Same as C1</text>
  <path d="M1430 685 L1430 730" class="dash"/>
  <text x="1445" y="714" class="small">RDMA · IB 100G+</text>
  <path d="M1430 802 L1430 880" class="line"/>
  <rect x="1355" y="880" width="150" height="90" rx="8" fill="#fffaf0" stroke="#f97316"/>
  <text x="1430" y="910" text-anchor="middle" class="box-title">Data Disk / NAS</text>
  <text x="1430" y="933" text-anchor="middle" class="small">Model weights</text>
  <text x="1430" y="954" text-anchor="middle" class="small">&gt;= 2 TB</text>

  <path d="M665 428 L790 428 L790 545 L960 545 L960 560" class="dash"/>
  <path d="M665 440 L775 440 L775 535 L1200 535 L1200 560" class="dash"/>
  <path d="M665 452 L760 452 L760 525 L1430 525 L1430 560" class="dash"/>
  <text x="686" y="417" class="small" style="fill:#c2410c">Image pull · 8090 / TCP</text>
  <path d="M475 635 L810 635 L810 610 L880 610" class="line"/>
  <path d="M475 750 L805 750 L805 450 L1080 450 L1080 610 L1120 610" class="line"/>
  <path d="M475 865 L515 865 L515 820 L800 820 L800 440 L1320 440 L1320 610 L1350 610" class="line"/>
  <text x="550" y="602" class="small">K8s API / node ports</text>
  <text x="550" y="620" class="small">6443, 32761-32765 TCP</text>

  <rect x="525" y="835" width="255" height="205" rx="12" class="external" stroke-width="1.5"/>
  <circle cx="550" cy="865" r="12" fill="#ffffff" stroke="#be185d"/>
  <text x="546" y="870" class="label">4</text>
  <text x="572" y="871" class="zone-title" style="fill:#9d174d;font-size:18px">Optional External Sources</text>
  <text x="652" y="895" text-anchor="middle" class="small">Internet outbound · enabled on request</text>
  <rect x="545" y="920" width="105" height="84" class="node" stroke="#db2777"/>
  <text x="597" y="950" text-anchor="middle" class="box-title">AGIOne SaaS</text>
  <text x="597" y="973" text-anchor="middle" class="small">Open API</text>
  <text x="597" y="992" text-anchor="middle" class="small">443 / TCP</text>
  <rect x="665" y="920" width="95" height="84" class="node" stroke="#db2777"/>
  <text x="712" y="945" text-anchor="middle" class="box-title">Providers</text>
  <text x="712" y="967" text-anchor="middle" class="small" style="font-size:10px">OpenAI / Anthropic</text>
  <text x="712" y="987" text-anchor="middle" class="small" style="font-size:10px">DeepSeek / Qwen</text>
  <path d="M475 885 L490 885 L490 940 L525 940" class="magenta-line"/>
  <path d="M475 900 L500 900 L500 965 L525 965" class="magenta-line"/>
  <text x="530" y="805" class="small" style="fill:#9d174d">Outbound HTTPS 443 (optional)</text>
</svg>
